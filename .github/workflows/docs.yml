name: Documentation

# Builds and deploys the PanelKit documentation site (docs-site/) to GitHub
# Pages. The API reference under docs-site/api/classes/*.md is generated
# from the actual package source via PHP Reflection on every run - see
# scripts/generate-api-manifest.php - so a merged source change that renames
# or removes a documented class/method is reflected in the next deploy
# automatically, and `validate` (below) fails the build first if a
# documented symbol goes missing.

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'docs/api-manifest/**'
      - 'packages/panel/src/**'
      - 'AI_BLUEPRINT.md'
      - 'scripts/generate-api-manifest.php'
      - 'scripts/generate-llms-txt.php'
      - 'scripts/check-docs.php'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs-site/**'
      - 'docs/api-manifest/**'
      - 'packages/panel/src/**'
      - 'AI_BLUEPRINT.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Only the playground's Composer dependencies are needed here - the
      # manifest generator autoloads packages/panel through the playground's
      # path repository, the same way the rest of the monorepo's tooling does.
      - name: Install PHP dependencies
        working-directory: apps/playground
        run: composer install --no-interaction --no-progress --prefer-dist

      # The manifest generator and check-docs.php boot the playground app
      # (for Artisan::all() and config) but never query its database - SQLite
      # with a fresh key is enough, no migration or seed needed.
      - name: Prepare the playground's minimal runtime env
        working-directory: apps/playground
        run: |
          cp -n .env.example .env
          touch database/database.sqlite
          php artisan key:generate --force

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the API reference and llms.txt
        run: |
          php scripts/generate-api-manifest.php --tag=${{ github.sha }}
          php scripts/generate-llms-txt.php

      - name: Validate documentation
        run: php scripts/check-docs.php

      - name: Build the site
        run: pnpm --filter panelkit-docs run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/.vitepress/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
