 Mallorca. Cada muro de piedra susurra siglos de historias; cada olivo de nuestros jardines ha sido testigo de generaciones de vida isleña.\",\"philosophy\":\"Creemos que el verdadero lujo reside en la autenticidad. Desde nuestros huertos ecológicos que abastecen nuestra cocina hasta nuestras colaboraciones con artesanos locales, cada detalle en Can Serena celebra el espíritu genuino del Mediterráneo.\",\"values\":{\"title\":\"Nuestros Valores\",\"sustainability\":{\"title\":\"Sostenibilidad\",\"description\":\"Operaciones neutras en carbono, instalaciones con energía solar y compromiso con preservar la belleza natural de Mallorca.\"},\"authenticity\":{\"title\":\"Autenticidad\",\"description\":\"Celebrando tradiciones locales, apoyando a artesanos mallorquines y sirviendo cocina de nuestros huertos ecológicos.\"},\"wellness\":{\"title\":\"Bienestar Holístico\",\"description\":\"Un santuario para mente, cuerpo y alma — desde rituales mediterráneos ancestrales hasta innovaciones modernas de bienestar.\"}}},\"mallorca\":{\"title\":\"Descubra Mallorca\",\"subtitle\":\"Una isla de maravillas infinitas\",\"description\":\"Más allá de las aguas turquesas y playas doradas se encuentra una isla de extraordinaria profundidad — pueblos antiguos en lo alto de colinas, calas secretas accesibles solo en barco, y un renacimiento culinario que está poniendo a Mallorca en el mapa gastronómico mundial.\",\"highlights\":{\"serra\":{\"title\":\"Serra de Tramuntana\",\"description\":\"Cordillera Patrimonio de la Humanidad con impresionantes rutas de senderismo y pueblos medievales.\"},\"beaches\":{\"title\":\"Calas Escondidas\",\"description\":\"Aguas cristalinas y playas apartadas que parecen su propio paraíso privado.\"},\"culture\":{\"title\":\"Patrimonio Vivo\",\"description\":\"Desde la catedral gótica de Palma hasta talleres artesanos que preservan oficios centenarios.\"},\"gastronomy\":{\"title\":\"Excelencia Culinaria\",\"description\":\"Restaurantes con estrellas Michelin, sob
