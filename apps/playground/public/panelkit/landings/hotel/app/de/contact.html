s mediterraner Gastfreundschaft\",\"description\":\"Can Serena wurde aus einem Traum geboren — einen Ort zu schaffen, an dem die Seele Mallorcas auf die Kunst der Gastfreundschaft trifft. Unsere Finca aus dem 16. Jahrhundert, liebevoll über drei Jahre restauriert, steht heute als Zeugnis des reichen Erbes der Insel und unseres Engagements für nachhaltigen Luxus.\",\"history\":\"Was einst als ländlicher Rückzugsort einer Adelsfamilie begann, hat sich zu einem der intimsten Boutique-Hotels Mallorcas entwickelt. Jede Steinmauer flüstert Geschichten aus Jahrhunderten; jeder Olivenbaum in unseren Gärten hat Generationen des Insellebens miterlebt.\",\"philosophy\":\"Wir glauben, dass wahrer Luxus in der Authentizität liegt. Von unseren biologischen Gärten, die unsere Küche versorgen, bis hin zu unseren Partnerschaften mit lokalen Kunsthandwerkern — jedes Detail bei Can Serena feiert den echten Geist des Mittelmeers.\",\"values\":{\"title\":\"Unsere Werte\",\"sustainability\":{\"title\":\"Nachhaltigkeit\",\"description\":\"Klimaneutraler Betrieb, solarbetriebene Anlagen und das Engagement, Mallorcas natürliche Schönheit zu bewahren.\"},\"authenticity\":{\"title\":\"Authentizität\",\"description\":\"Pflege lokaler Traditionen, Unterstützung mallorquinischer Kunsthandwerker und Küche aus unseren biologischen Gärten.\"},\"wellness\":{\"title\":\"Ganzheitliches Wohlbefinden\",\"description\":\"Ein Refugium für Körper, Geist und Seele — von antiken mediterranen Ritualen bis zu modernen Wellness-Innovationen.\"}}},\"mallorca\":{\"title\":\"Mallorca Entdecken\",\"subtitle\":\"Eine Insel voller Wunder\",\"description\":\"Jenseits der türkisfarbenen Gewässer und goldenen Strände liegt eine Insel von außergewöhnlicher Tiefe — uralte Dörfer auf Hügeln, geheime Buchten, nur per Boot erreichbar, und eine kulinarische Renaissance, die Mallorca auf die gastronomische Weltkarte setzt.\",\"highlights\":{\"serra\":{\"title\":\"Serra de Tramuntana\",\"description\":\"UNESCO-Welterbe-Gebirge mit atemberaubenden Wanderwegen und mittelalterlichen Dörfern.\"},\"beaches\":{\"title\":\"Versteckte Buchten\",\"description\":\"Kristallklares Wasser und abgeschiedene Strände, die sich wie Ihr eigenes privates Paradies anfühlen.\"},\"culture\":{\"title\":\"Lebendiges Erbe\",\"description\":\"Von Palmas gotischer Kathedrale bis zu Handwerksbetrieben, die jahrhundertealte Traditionen bewahren.\"},\"gastronomy\":{\"title\":\"Kulinarische Exzellenz\",\"description\":\"Michelin-Sterne-Restaurants, traditionelle Sobrasada und weltberühmte Weine.\"}}},\"rooms\":{\"title\":\"Zimmer \u0026 Suiten\",\"subtitle\":\"Wo Komfort auf Charakter trifft\",\"description\":\"Jedes unserer 18 Zimmer erzählt seine eigene Geschichte — handverlesene Antiquitäten treffen auf zeitgenössischen Komfort, ursprüngliche Steinmauern umfassen moderne Annehmlichkeiten, und private Terrassen öffnen sich zu Ausblicken, die seit Jahrhunderten Dichter inspirieren.\",\"viewAll\":\"Alle Unterkünfte ansehen\",\"inEveryRoom\":\"In jedem Zimmer\",\"from\":\"Ab\",\"perNight\":\"/Nacht\",\"bookNow\":\"Jetzt buchen\",\"amenityList\":{\"gardenView\":\"Gartenblick\",\"rainfallShower\":\"Regenwalddusche\",\"kingBed\":\"Kingsize-Bett\",\"terracottaFloors\":\"Terrakottaböden\",\"privateTerrace\":\"Private Terrasse\",\"freestandingBathtub\":\"Freistehende Badewanne\",\"mountainViews\":\"Bergblick\",\"sittingArea\":\"Sitzbereich\",\"privatePool\":\"Privater Pool\",\"butlerService\":\"Butler-Service\",\"outdoorDining\":\"Außen-Essbereich\",\"separateLivingRoom\":\"Separates Wohnzimmer\"},\"types\":{\"garden\":{\"title\":\"Gartenzimmer\",\"description\":\"Intime Rückzugsorte mit Blick auf unsere biologischen Gärten, mit originalen Terrakottaböden und Regenwaldduschen.\",\"size\":\"35 m²\"},\"terrace\":{\"title\":\"Terrassen-Suite\",\"description\":\"Großzügige Refugien mit privaten Terrassen, freistehenden Badewannen und Panorama-Bergblick.\",\"size\":\"55 m²\"},\"master\":{\"title\":\"Master Suite\",\"description\":
